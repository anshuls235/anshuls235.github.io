name: Verify and deploy portfolio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Test policies in isolated PostgreSQL
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          npm run test:policies
      - name: Build GitHub Pages artifact
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ANALYTICS_ENABLED: ${{ vars.VITE_ANALYTICS_ENABLED || 'true' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://anshuls235.github.io/' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      - run: npm run security:scan
      - name: Install test browser
        # The runner image already carries Chromium's libraries; the extra system
        # packages are best-effort so an Ubuntu mirror outage cannot block a deploy.
        run: |
          npx playwright install chromium
          timeout 120 npx playwright install-deps chromium || echo "::warning::Playwright system packages were not installed; using the runner image's libraries."
      - name: Browser checks against production build
        run: |
          npm run preview -- --port 4173 &
          for attempt in {1..30}; do curl -fsS "http://127.0.0.1:4173${BASE_PATH:-/}" > /dev/null && break; sleep 1; done
          npm run test:browser
        env:
          CI: "true"
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          PORTFOLIO_PREVIEW_URL: "http://127.0.0.1:4173${{ vars.BASE_PATH || '/' }}"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
