<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--META-->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link
      rel="preload"
      href="/assets/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/src/theme.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" id="navbar">
      <nav class="container nav" aria-label="Main navigation">
        <a class="wordmark" href="#home"
          ><span class="monogram" aria-hidden="true">as<span>.</span></span
          ><span id="nav-name">Anshul Sharma</span></a
        >
        <button
          class="menu-toggle"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="main-nav"
          type="button"
          hidden
        >
          Menu <svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 14h14" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <div class="main-nav" id="main-nav">
          <a href="#projects">Work</a><a href="#experience">Experience</a
          ><a href="#writing">Writing</a><a href="#about">About</a
          ><a class="nav-contact" href="#contact"
            >Let’s talk <span aria-hidden="true"><svg class="arrow-icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5 M7 5h12v12"/></svg></span></a
          >
        </div>
        <button
          class="theme-toggle"
          type="button"
          aria-label="Switch to dark theme"
          aria-pressed="false"
          hidden
        >
          <svg
            viewBox="0 0 24 24"
            width="19"
            height="19"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="M20 14A8.5 8.5 0 0 1 10 4a8.5 8.5 0 1 0 10 10Z" />
          </svg>
        </button>
      </nav>
    </header>
    <div id="portfolio"><!--CONTENT--></div>
    <p
      id="content-status"
      class="content-status"
      role="status"
      aria-live="polite"
    ></p>
    <dialog id="project-dialog" aria-labelledby="detail-title">
      <div class="dialog-toolbar">
        <span class="mono">PROJECT NOTES</span
        ><button
          id="close-dialog"
          type="button"
          aria-label="Close project details"
        >
          Close <span aria-hidden="true">×</span>
        </button>
      </div>
      <div id="project-detail"></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
